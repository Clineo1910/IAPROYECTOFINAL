<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGE-360 | Convivencia Escolar</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sige-sidebar" class="sidebar"></aside>
    <div class="main-area">
      <header id="sige-topbar" class="topbar"></header>
      <main class="workspace">
        <section class="content-col">
          <div class="card">
            <div class="card-head">
              <div>
                <h2>Registrar Incidencia de Convivencia Escolar</h2>
                <p>Impacta la señal socioemocional (máximo 20 pts del índice de riesgo predictivo)</p>
              </div>
            </div>
            <form id="form-incidencia" class="form-grid">
              <div class="field">
                <label for="inc-alumno">Estudiante</label>
                <select id="inc-alumno" required></select>
              </div>
              <div class="field">
                <label for="inc-tipo">Tipo de Evento</label>
                <select id="inc-tipo" required>
                  <option value="AISLAMIENTO">AISLAMIENTO</option>
                  <option value="CONFLICTO">CONFLICTO</option>
                  <option value="DISRUPCION">DISRUPCIÓN</option>
                  <option value="RECONOCIMIENTO">RECONOCIMIENTO (Positivo)</option>
                </select>
              </div>
              <div class="field">
                <label for="inc-gravedad">Gravedad</label>
                <select id="inc-gravedad" required>
                  <option value="ALTA">ALTA (+12 pts)</option>
                  <option value="MEDIA" selected>MEDIA (+7 pts)</option>
                  <option value="BAJA">BAJA (+3 pts)</option>
                </select>
              </div>
              <div class="field" style="grid-column:1 / -1;">
                <label for="inc-desc">Descripción observada</label>
                <input id="inc-desc" type="text" maxlength="240" placeholder="Ej. Baja participación y fatiga constante en clase" required>
              </div>
              <button type="submit" class="btn btn-primary">Guardar Incidencia</button>
            </form>
            <div id="toast-inc" class="toast-ok" hidden></div>
          </div>

          <!-- Registro de Convivencia SOLO del estudiante seleccionado -->
          <div class="card">
            <div class="card-head">
              <div>
                <h2 id="tit-inc-est">Registro de Convivencia del Estudiante</h2>
                <p>Cambia el estudiante arriba para ver su historial individual</p>
              </div>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr><th>Fecha</th><th>Tipo</th><th>Gravedad</th><th>Descripción</th></tr>
                </thead>
                <tbody id="tabla-inc-est"></tbody>
              </table>
            </div>
          </div>
        </section>
        <aside id="sige-chat-panel" class="chat-panel"></aside>
      </main>
    </div>
  </div>

  <script src="/layout.js?v=4"></script>
  <script>
    async function cargarHistorialEstudiante() {
      const sel = document.getElementById('inc-alumno');
      const aid = sel.value;
      if (!aid) return;
      const nombre = sel.options[sel.selectedIndex]?.textContent || '';
      document.getElementById('tit-inc-est').textContent = `Registro de Convivencia — ${nombre}`;

      const r = await fetch(`/api/alumno/${aid}`);
      const d = await r.json();
      const tbody = document.getElementById('tabla-inc-est');
      tbody.textContent = '';
      const lista = d.incidencias || [];
      if (lista.length === 0) {
        const tr = document.createElement('tr');
        const td = document.createElement('td'); td.colSpan = 4; td.style.textAlign = 'center'; td.style.color = '#64748b';
        td.textContent = 'Este estudiante no tiene incidencias de convivencia registradas.';
        tr.appendChild(td); tbody.appendChild(tr); return;
      }
      lista.forEach((i) => {
        const tr = document.createElement('tr');
        [String(i.fecha).slice(0, 10), i.tipo].forEach((v) => { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); });
        const tdG = document.createElement('td');
        const b = document.createElement('span'); b.className = 'badge ' + (i.gravedad === 'ALTA' ? 'badge-ROJO' : (i.gravedad === 'MEDIA' ? 'badge-AMBAR' : 'badge-VERDE')); b.textContent = i.gravedad;
        tdG.appendChild(b); tr.appendChild(tdG);
        const tdD = document.createElement('td'); tdD.textContent = i.descripcion; tr.appendChild(tdD);
        tbody.appendChild(tr);
      });
    }

    async function cargar() {
      const rd = await fetch('/api/dashboard');
      const alumnos = ((await rd.json()).alumnos || []).sort((a, b) => a.alumno_id - b.alumno_id);
      const sel = document.getElementById('inc-alumno');
      if (sel.options.length === 0) {
        alumnos.forEach((a) => {
          const opt = document.createElement('option');
          opt.value = String(a.alumno_id);
          opt.textContent = `${a.nombre_completo} (${a.grado} ${a.seccion})`;
          sel.appendChild(opt);
        });
        window.SIGE.hacerBuscable('inc-alumno', 'Filtrar estudiante...');
      }
      await cargarHistorialEstudiante();
    }

    document.getElementById('inc-alumno').addEventListener('change', cargarHistorialEstudiante);

    document.getElementById('form-incidencia').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const r = await fetch('/api/incidencias', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          alumno_id: Number(document.getElementById('inc-alumno').value),
          tipo: document.getElementById('inc-tipo').value,
          gravedad: document.getElementById('inc-gravedad').value,
          descripcion: document.getElementById('inc-desc').value,
        }),
      });
      const d = await r.json();
      if (r.ok) { document.getElementById('inc-desc').value = ''; window.SIGE.mostrarToast('toast-inc', d.mensaje); await cargar(); }
    });

    window.SIGE.iniciarLayout({ paginaActiva: 'convivencia', titulo: 'Convivencia Escolar' }).then(cargar);
  </script>
</body>
</html>
